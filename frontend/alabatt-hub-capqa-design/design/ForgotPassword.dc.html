<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="capqa" style="min-height: 100vh; background: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; gap: 24px">
  <a href="Login.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0f172a">
    <div class="logo-slot on-light" style="width: 44px; height: 44px; font-size: 8px">RFMOAUM</div>
    <div class="brand"><span class="brand-hub">ALABATT-HUB</span><span class="brand-name">CAPQA</span></div>
  </a>
  <main class="card" style="width: 100%; max-width: 440px">
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div class="card-body empty" role="status" style="padding: 40px 28px">
        <span class="e-icon" style="background: #effaf2; color: #166534"><dc-import name="Icon" i="mail" s="26" hint-size="26px,26px"></dc-import></span>
        <h1 class="h2">Check your email</h1>
        <p>If an account exists for <strong>n.okafor@moau.edu.ng</strong>, we’ve sent a link to reset your password. The link expires in 30 minutes.</p>
        <button type="button" class="link-btn t-sm">Didn’t get it? Resend email</button>
        <a class="btn btn-secondary" href="Login.dc.html"><dc-import name="Icon" i="arrow-left" s="16" hint-size="16px,16px"></dc-import>Back to sign in</a>
      </div>
    </sc-if>
    <sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
      <form class="card-body stack" style="padding: 28px" onSubmit="{{submit}}">
        <div><h1 class="h2">Forgot your password?</h1><p class="muted t-sm" style="margin-top: 4px">Enter the email on your CAPQA account and we’ll send you a reset link.</p></div>
        <div class="field"><label class="label" for="fp-email">Email</label><input id="fp-email" class="input" type="email" autocomplete="email" value="n.okafor@moau.edu.ng"></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Send reset link</button>
        <a href="Login.dc.html" class="t-sm strong" style="text-align: center">Back to sign in</a>
      </form>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"default","options":["default","success"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false }; }
  renderVals() {
    var self = this, sent = this.state.sent || (this.props.view ?? 'default') === 'success';
    return { sent: sent, form: !sent, submit: function (e) { e.preventDefault(); self.setState({ sent: true }); } };
  }
}
</script>
</body>
</html>
