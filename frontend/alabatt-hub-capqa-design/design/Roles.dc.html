<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar by role</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="capqa" style="width: 1520px; height: 1000px; box-sizing: border-box; padding: 32px; background: #f1f5f9; display: flex; flex-direction: column; gap: 20px">
  <div><h1 class="h2">Sidebar per role</h1><p class="muted">Items a role cannot access are removed, not disabled. Viewer sees read-only pages without action buttons.</p></div>
  <div style="display: flex; gap: 32px; align-items: flex-start">
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 10px; width: 256px">
        <div class="row-between"><span class="strong">{{r.name}}</span><span class="t-xs muted">{{r.note}}</span></div>
        <div style="height: 820px; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 12px -2px rgba(15,23,42,.10)">
          <dc-import name="Sidebar" mode="static" role="{{r.name}}" active="dashboard" hint-size="256px,820px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1520,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { roles: [
      { name: 'Admin', note: '13 items' }, { name: 'Director', note: '10 items' }, { name: 'Academic Officer', note: '8 items' },
      { name: 'Quality Inspector', note: '8 items' }, { name: 'Viewer', note: '6 items' }
    ] };
  }
}
</script>
</body>
</html>
