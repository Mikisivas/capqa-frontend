<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alternative halls · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Academic Officer" active="halls" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Academic Officer" active="halls" crumbs="Classrooms and Halls>Alternative halls" hint-size="100%,64px"></dc-import>
    <main class="page">
      <div class="page-head"><div><h1 class="h1">Alternative halls</h1><p class="sub">Free halls that fit your students, best fit first.</p></div></div>
      <form class="card filter-bar" style="border-radius: 8px" aria-label="Search criteria">
        <label class="field"><span class="label">Students <span class="req" aria-hidden="true">*</span></span><input class="input num" type="number" value="380"></label>
        <label class="field"><span class="label">Start <span class="req" aria-hidden="true">*</span></span><input class="input" type="datetime-local" value="2026-10-15T12:00"></label>
        <label class="field"><span class="label">End <span class="req" aria-hidden="true">*</span></span><input class="input" type="datetime-local" value="2026-10-15T15:00"></label>
        <label class="field"><span class="label">Department <span class="opt">(optional)</span></span><select class="select"><option>Any department</option><option>Mathematics and Computer Science</option></select></label>
        <button type="button" class="btn btn-primary"><dc-import name="Icon" i="search" s="16" hint-size="16px,16px"></dc-import>Find halls</button>
      </form>
      <p class="t-sm muted" aria-live="polite">4 halls available on Wed, 15 Oct 2026, 12:00–15:00 for 380 students</p>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px" aria-label="Suggested halls">
        <sc-for list="{{halls}}" as="h" hint-placeholder-count="4">
          <li class="card" style="{{h.ring}}">
            <div class="card-body" style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center">
              <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: {{h.rankBg}}; color: {{h.rankFg}}; font-weight: 700; flex: none" aria-label="Rank {{h.rank}}">{{h.rank}}</span>
              <div style="flex: 1 1 260px; min-width: 0" class="stack-sm">
                <div class="row"><h2 class="h3">{{h.n}}</h2><sc-if value="{{h.best}}" hint-placeholder-val="{{ false }}"><span class="badge tone-success">Best fit</span></sc-if></div>
                <span class="t-sm muted">{{h.b}} · {{h.d}}</span>
                <div class="row" style="gap: 6px"><sc-for list="{{h.eq}}" as="e" hint-placeholder-count="2"><span class="tag">{{e}}</span></sc-for></div>
              </div>
              <div style="flex: 0 1 240px; min-width: 180px" class="stack-sm">
                <div class="row-between t-sm"><span><span class="strong num">{{h.c}}</span> seats</span><span class="muted">{{h.fit}} used</span></div>
                <div class="progress" role="img" aria-label="380 students use {{h.fit}} of {{h.c}} seats"><span style="width: {{h.fit}}"></span></div>
                <span class="t-xs muted">{{h.spare}} spare seats</span>
              </div>
              <a class="btn {{h.btn}}" href="Allocations.dc.html">Use this hall</a>
            </div>
          </li>
        </sc-for>
      </ol>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    var H = [['Arts Theatre', 'Faculty of Arts', 'Theatre Arts', 400, ['Audio']], ['Faculty of Science Lecture Theatre 2', 'Faculty of Science Complex', 'Mathematics and Computer Science', 450, ['Audio', 'Projector', 'AC']], ['Management Sciences Hall A', 'Management Sciences Complex', 'Business Management', 500, ['Audio', 'AC']], ['1000-Seater Auditorium', 'Main Campus', 'Shared', 1000, ['Audio', 'Projector']]];
    return { halls: H.map(function (h, i) {
      var best = i === 0;
      return { rank: i + 1, n: h[0], b: h[1], d: h[2], c: h[3].toLocaleString('en-NG'), eq: h[4], fit: Math.round(380 / h[3] * 100) + '%', spare: (h[3] - 380).toLocaleString('en-NG'), best: best,
        ring: best ? 'border-color: #1a763f; box-shadow: 0 0 0 1px #1a763f' : '', rankBg: best ? '#166534' : '#f1f5f9', rankFg: best ? '#fff' : '#334155', btn: best ? 'btn-primary' : 'btn-secondary' };
    }) };
  }
}
</script>
</body>
</html>
