<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All evaluations · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Director" active="eval" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Director" active="eval" crumbs="Staff Evaluation>All evaluations" hint-size="100%,64px"></dc-import>
    <main class="page">
      <div class="page-head"><div><div class="row"><span class="tag tag-conf"><dc-import name="Icon" i="lock" s="12" hint-size="12px,12px"></dc-import>Confidential</span></div><h1 class="h1" style="margin-top: 8px">Staff evaluations</h1><p class="sub">Session 2025/2026 · 186 evaluations of 94 staff</p></div><div class="row"><a class="btn btn-secondary" href="EvalTrends.dc.html"><dc-import name="Icon" i="trend" s="16" hint-size="16px,16px"></dc-import>Trends</a><a class="btn btn-primary" href="EvalNew.dc.html"><dc-import name="Icon" i="plus" s="16" hint-size="16px,16px"></dc-import>New evaluation</a></div></div>
      <section class="card">
        <div class="filter-bar">
          <label class="field grow"><span class="label">Search staff</span><span class="input-wrap"><span class="lead"><dc-import name="Icon" i="search" s="18" hint-size="18px,18px"></dc-import></span><input class="input" type="search" placeholder="Name or staff number"></span></label>
          <label class="field"><span class="label">Department</span><select class="select"><option>All departments</option></select></label>
          <label class="field"><span class="label">Source</span><select class="select"><option>All sources</option><option>Student</option><option>Peer</option><option>Management</option></select></label>
          <label class="field"><span class="label">Session</span><select class="select"><option>2025/2026</option><option>2024/2025</option></select></label>
          <label class="field"><span class="label">Semester</span><select class="select"><option>Both</option><option>1</option><option>2</option></select></label>
        </div>
        <sc-if value="{{isDefault}}" hint-placeholder-val="{{ true }}">
          <div class="table-wrap"><table class="table table-stack">
            <thead><tr><th scope="col">Staff member</th><th scope="col">Department</th><th scope="col">Source</th><th scope="col">Session · sem.</th><th scope="col" class="r">Average</th><th scope="col">Evaluator</th><th scope="col" aria-sort="descending"><button type="button" class="th-sort is-active">Date<dc-import name="Icon" i="arrow-down" s="14" hint-size="14px,14px"></dc-import></button></th><th scope="col" class="r"><span class="sr-only">Actions</span></th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                <tr><td class="td-lead" data-label="Staff"><a class="strong" href="EvalHistory.dc.html">{{r.n}}</a></td><td data-label="Department">{{r.d}}</td><td data-label="Source"><span class="badge" data-s="src-{{r.s}}">{{r.s}}</span></td><td data-label="Session" class="num">{{r.p}}</td><td data-label="Average" class="r num strong">{{r.a}}</td><td data-label="Evaluator">{{r.by}}</td><td data-label="Date" class="num">{{r.dt}}</td><td class="td-actions"><a class="btn btn-ghost btn-sm" href="EvalDetail.dc.html">View</a></td></tr>
              </sc-for>
            </tbody>
          </table></div>
          <div class="pagination"><span>Showing 1–8 of 186</span><div class="pager"><button type="button" disabled aria-label="Previous page"><dc-import name="Icon" i="chev-left" s="16" hint-size="16px,16px"></dc-import></button><button type="button" aria-current="page">1</button><button type="button">2</button><button type="button">3</button><button type="button" aria-label="Next page"><dc-import name="Icon" i="chev-right" s="16" hint-size="16px,16px"></dc-import></button></div></div>
        </sc-if>
        <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="loading" hint-size="100%,360px"></dc-import></sc-if>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="empty" title="No evaluations for this session" text="Evaluations entered by inspectors and management appear here." cta="New evaluation" href="EvalNew.dc.html" icon="star" hint-size="100%,320px"></dc-import></sc-if>
        <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="error" hint-size="100%,320px"></dc-import></sc-if>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"default","options":["default","loading","empty","error"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.view ?? 'default';
    var R = [['Dr. Stephen Akuma', 'Mathematics and Computer Science', 'Peer', '2025/2026 · 2', '4.3', 'Mr. Emmanuel Ochoga', '12 Oct 2026'], ['Mrs. Doosuur Agber', 'Accounting', 'Student', '2025/2026 · 2', '3.9', 'Student panel (42)', '10 Oct 2026'], ['Prof. Joseph Ogbu', 'Physics', 'Management', '2025/2026 · 2', '4.7', 'Prof. Msughter Iorkyaa', '8 Oct 2026'], ['Dr. Rose Aondoakaa', 'Economics', 'Peer', '2025/2026 · 2', '3.3', 'Dr. Aondohemba Tyokase', '6 Oct 2026'], ['Mr. Peter Ikyaator', 'Theatre Arts', 'Student', '2025/2026 · 2', '2.8', 'Student panel (31)', '2 Oct 2026'], ['Dr. Stephen Akuma', 'Mathematics and Computer Science', 'Student', '2025/2026 · 2', '4.0', 'Student panel (58)', '30 Sep 2026'], ['Dr. Grace Unongo', 'English', 'Management', '2025/2026 · 1', '4.1', 'Prof. Msughter Iorkyaa', '22 May 2026'], ['Dr. Felix Adah', 'History', 'Peer', '2025/2026 · 1', '3.6', 'Mr. Emmanuel Ochoga', '19 May 2026']];
    return { isDefault: v === 'default', isLoading: v === 'loading', isEmpty: v === 'empty', isError: v === 'error', rows: R.map(function (r) { return { n: r[0], d: r[1], s: r[2], p: r[3], a: r[4], by: r[5], dt: r[6] }; }) };
  }
}
</script>
</body>
</html>
