<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change accreditation status · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Director" active="dept" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Director" active="dept" crumbs="Departments>Courses>CMP 312>Accreditation" hint-size="100%,64px"></dc-import>
    <main class="page page-narrow">
      <div class="page-head"><div><h1 class="h1">Change accreditation status</h1><p class="sub"><span class="mono strong">CMP 312</span> Database Systems · Dept. of Mathematics and Computer Science · 300 level</p></div></div>
      <form class="stack-lg">
        <section class="card card-body stack">
          <div class="row" style="gap: 12px"><span class="t-sm muted">Current status</span><span class="badge" data-s="acc-Interim">Interim</span><span class="t-xs muted">since 14 Jul 2026</span></div>
          <fieldset class="field" style="border: 0; padding: 0; margin: 0"><legend class="label" style="margin-bottom: 6px">New status <span class="req" aria-hidden="true">*</span></legend>
            <div class="radio-cards"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><label class="radio-card {{o.cls}}" style="flex-direction: column; align-items: flex-start; gap: 6px"><span class="row" style="gap: 8px"><input type="radio" name="cr-s" checked="{{o.on}}" onChange="{{o.pick}}"><span class="badge" data-s="acc-{{o.v}}">{{o.v}}</span></span><span class="t-xs muted" style="font-weight: 400">{{o.d}}</span></label></sc-for></div>
          </fieldset>
          <div class="grid-form">
            <div class="field"><label class="label" for="cr-date">Effective date <span class="req" aria-hidden="true">*</span></label><input id="cr-date" class="input" type="date" value="2026-11-05"></div>
            <div class="field"><label class="label" for="cr-ref">NUC letter reference <span class="opt">(optional)</span></label><input id="cr-ref" class="input mono" value="NUC/ES/412/Vol.9/118"></div>
            <div class="field span-2"><label class="label" for="cr-why">Reason <span class="req" aria-hidden="true">*</span></label><textarea id="cr-why" class="textarea">Resource verification visit of 3–5 November 2026 confirmed adequate laboratory and staff.</textarea></div>
          </div>
          <sc-if value="{{isDenied}}" hint-placeholder-val="{{ false }}"><div class="alert alert-danger"><span class="a-icon"><dc-import name="Icon" i="alert" s="18" hint-size="18px,18px"></dc-import></span><div>Denied courses can’t be allocated exam halls and move the department to <strong>Red</strong> on the compliance dashboard.</div></div></sc-if>
        </section>
        <div class="action-bar"><a class="btn btn-secondary" href="CourseList.dc.html">Cancel</a><a class="btn btn-primary" href="CourseList.dc.html">Update status</a></div>
      </form>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 'Full' }; }
  renderVals() {
    var self = this;
    var O = [['Full', 'Accredited for 5 years'], ['Interim', 'Re-visit within 2 years'], ['Denied', 'Not accredited; admissions paused']];
    return { isDenied: this.state.s === 'Denied', opts: O.map(function (o) { var on = o[0] === self.state.s; return { v: o[0], d: o[1], on: on, cls: on ? 'is-on' : '', pick: function () { self.setState({ s: o[0] }); } }; }) };
  }
}
</script>
</body>
</html>
