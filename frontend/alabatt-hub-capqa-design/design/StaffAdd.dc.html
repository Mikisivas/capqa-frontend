<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add staff member · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Academic Officer" active="dept" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Academic Officer" active="dept" crumbs="Departments>Mathematics and Computer Science>Add staff" hint-size="100%,64px"></dc-import>
    <main class="page page-narrow">
      <div class="page-head"><div><h1 class="h1">Add staff member</h1><p class="sub">Dept. of Mathematics and Computer Science</p></div></div>
      <form class="stack-lg" novalidate>
        <div class="card"><div class="card-body grid-form">
          <div class="field"><label class="label" for="sa-title">Title</label><select id="sa-title" class="select" disabled="{{saving}}"><option>Dr.</option><option>Prof.</option><option>Mr.</option><option>Mrs.</option><option>Ms.</option></select></div>
          <div class="field"><label class="label" for="sa-no">Staff number <span class="req" aria-hidden="true">*</span></label><input id="sa-no" class="input mono {{invCls}}" value="{{no}}" aria-invalid="{{invAria}}" disabled="{{saving}}"><sc-if value="{{invalid}}" hint-placeholder-val="{{ false }}"><span class="err"><dc-import name="Icon" i="alert-circle" s="16" hint-size="16px,16px"></dc-import>Staff number is required.</span></sc-if><span class="help">e.g. MOAU/SS/0412</span></div>
          <div class="field span-2"><label class="label" for="sa-name">Full name <span class="req" aria-hidden="true">*</span></label><input id="sa-name" class="input" value="Stephen Akuma" disabled="{{saving}}"></div>
          <div class="field"><label class="label" for="sa-rank">Rank <span class="req" aria-hidden="true">*</span></label><select id="sa-rank" class="select" disabled="{{saving}}"><option>Senior Lecturer</option><option>Professor</option><option>Reader / Associate Professor</option><option>Lecturer I</option><option>Lecturer II</option><option>Assistant Lecturer</option><option>Graduate Assistant</option></select></div>
          <div class="field"><label class="label" for="sa-type">Employment</label><select id="sa-type" class="select" disabled="{{saving}}"><option>Full-time</option><option>Part-time</option><option>Visiting</option><option>Sabbatical</option></select><span class="help">Only full-time staff count toward the NUC ratio</span></div>
          <div class="field span-2"><label class="label" for="sa-email">Email <span class="opt">(optional)</span></label><input id="sa-email" class="input" type="email" value="s.akuma@moau.edu.ng" disabled="{{saving}}"></div>
          <div class="field span-2"><label class="label" for="sa-q">Highest qualification <span class="opt">(optional)</span></label><input id="sa-q" class="input" value="Ph.D. Computer Science (University of Nigeria, Nsukka)" disabled="{{saving}}"></div>
        </div></div>
        <div class="action-bar">
          <a class="btn btn-secondary" href="StaffList.dc.html">Cancel</a>
          <sc-if value="{{saving}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-primary is-loading" aria-busy="true"><span class="spin" aria-hidden="true"></span>Saving…</button></sc-if>
          <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><a class="btn btn-primary" href="StaffList.dc.html">Add staff member</a></sc-if>
        </div>
      </form>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"default","options":["default","invalid","saving"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { var v = this.props.view ?? 'default'; return { invalid: v === 'invalid', saving: v === 'saving', idle: v !== 'saving', invCls: v === 'invalid' ? 'is-invalid' : '', invAria: v === 'invalid' ? 'true' : 'false', no: v === 'invalid' ? '' : 'MOAU/SS/0412' }; }
}
</script>
</body>
</html>
