<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course list · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Academic Officer" active="dept" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Academic Officer" active="dept" crumbs="Departments>Courses" hint-size="100%,64px"></dc-import>
    <main class="page">
      <div class="page-head"><div><h1 class="h1">Courses</h1><p class="sub">With NUC accreditation status</p></div><a class="btn btn-primary" href="CourseAdd.dc.html"><dc-import name="Icon" i="plus" s="16" hint-size="16px,16px"></dc-import>Add course</a></div>
      <section class="card">
        <div class="filter-bar">
          <label class="field grow"><span class="label">Search</span><span class="input-wrap"><span class="lead"><dc-import name="Icon" i="search" s="18" hint-size="18px,18px"></dc-import></span><input class="input" type="search" placeholder="Code or course name"></span></label>
          <label class="field"><span class="label">Department</span><select class="select"><option>Mathematics and Computer Science</option><option>All departments</option></select></label>
          <label class="field"><span class="label">Level</span><select class="select"><option>All levels</option><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option><option>600</option></select></label>
          <label class="field"><span class="label">Accreditation</span><select class="select"><option>All</option><option>Full</option><option>Interim</option><option>Denied</option></select></label>
        </div>
        <sc-if value="{{isDefault}}" hint-placeholder-val="{{ true }}">
          <div class="table-wrap"><table class="table table-stack">
            <thead><tr><th scope="col" aria-sort="ascending"><button type="button" class="th-sort is-active">Code<dc-import name="Icon" i="arrow-up" s="14" hint-size="14px,14px"></dc-import></button></th><th scope="col">Course name</th><th scope="col">Level</th><th scope="col">Department</th><th scope="col">Accreditation</th><th scope="col" class="r"><span class="sr-only">Actions</span></th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                <tr><td class="td-lead mono strong" data-label="Code">{{r.c}}</td><td data-label="Course">{{r.n}}</td><td data-label="Level">{{r.l}}</td><td data-label="Department">Mathematics and Computer Science</td><td data-label="Accreditation"><span class="badge" data-s="acc-{{r.a}}">{{r.a}}</span></td><td class="td-actions"><div class="row" style="flex-wrap: nowrap; justify-content: flex-end; gap: 4px"><a class="btn btn-ghost btn-sm" href="CourseAccreditation.dc.html">Status</a><a class="btn btn-ghost btn-icon btn-sm" href="DeptEdit.dc.html" aria-label="Edit {{r.c}}"><dc-import name="Icon" i="edit" s="16" hint-size="16px,16px"></dc-import></a></div></td></tr>
              </sc-for>
            </tbody>
          </table></div>
          <div class="pagination"><span>Showing 1–8 of 13</span><div class="pager"><button type="button" disabled aria-label="Previous page"><dc-import name="Icon" i="chev-left" s="16" hint-size="16px,16px"></dc-import></button><button type="button" aria-current="page">1</button><button type="button">2</button><button type="button" aria-label="Next page"><dc-import name="Icon" i="chev-right" s="16" hint-size="16px,16px"></dc-import></button></div></div>
        </sc-if>
        <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="loading" hint-size="100%,360px"></dc-import></sc-if>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="empty" title="No courses yet" text="Add the department’s courses and their accreditation status." cta="Add course" href="CourseAdd.dc.html" icon="book" hint-size="100%,320px"></dc-import></sc-if>
        <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><dc-import name="ListState" kind="error" hint-size="100%,320px"></dc-import></sc-if>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"default","options":["default","loading","empty","error"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.view ?? 'default';
    var R = [['CMP 101', 'Introduction to Computer Science', 100, 'Full'], ['CMP 211', 'Programming II', 200, 'Full'], ['CMP 312', 'Database Systems', 300, 'Interim'], ['CMP 314', 'Operating Systems', 300, 'Full'], ['CMP 411', 'Software Engineering', 400, 'Full'], ['CMP 415', 'Software Project Management', 400, 'Interim'], ['MTH 201', 'Mathematical Methods', 200, 'Full'], ['STA 211', 'Probability I', 200, 'Full']];
    return { isDefault: v === 'default', isLoading: v === 'loading', isEmpty: v === 'empty', isError: v === 'error', rows: R.map(function (r) { return { c: r[0], n: r[1], l: r[2], a: r[3] }; }) };
  }
}
</script>
</body>
</html>
