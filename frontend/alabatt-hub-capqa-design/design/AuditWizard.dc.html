<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exam hall audit · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app capqa">
  <dc-import name="Sidebar" mode="rail" role="Quality Inspector" active="audit" hint-size="256px,100%"></dc-import>
  <div class="app-main">
    <dc-import name="Topbar" role="Quality Inspector" active="audit" crumbs="Exam Hall Audit>New audit" hint-size="100%,64px"></dc-import>
    <main class="page" style="max-width: 600px; margin: 0 auto">
      <div class="stack-sm">
        <div class="row-between"><span class="t-sm strong">Step {{stepNo}} of 7 · {{stepName}}</span><span class="t-sm muted">{{pct}}</span></div>
        <div class="progress" role="progressbar" aria-label="Audit progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="{{stepNo}}"><span style="width: {{pct}}"></span></div>
      </div>

      <sc-if value="{{isHall}}" hint-placeholder-val="{{ false }}">
        <section class="stack" aria-labelledby="w-hall">
          <h1 class="h1" id="w-hall">Which hall are you auditing?</h1>
          <label class="input-wrap"><span class="sr-only">Search halls</span><span class="lead"><dc-import name="Icon" i="search" s="18" hint-size="18px,18px"></dc-import></span><input class="input" type="search" placeholder="Search halls"></label>
          <div class="stack-sm" role="radiogroup" aria-label="Hall">
            <sc-for list="{{halls}}" as="h" hint-placeholder-count="4">
              <label class="radio-card {{h.cls}}" style="min-height: 64px"><input type="radio" name="w-hall" checked="{{h.on}}" onChange="{{h.pick}}"><span style="flex: 1 1 auto"><span class="strong">{{h.n}}</span><br><span class="t-xs muted">{{h.b}} · {{h.c}} seats</span></span><sc-if value="{{h.due}}" hint-placeholder-val="{{ false }}"><span class="badge tone-info">Assigned</span></sc-if></label>
            </sc-for>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{isRating}}" hint-placeholder-val="{{ true }}">
        <section class="stack" aria-labelledby="w-item">
          <div class="row" style="gap: 12px; flex-wrap: nowrap"><span class="ico-box" style="width: 48px; height: 48px"><dc-import name="Icon" i="{{item.i}}" s="24" hint-size="24px,24px"></dc-import></span><div><span class="t-xs muted">Faculty of Science Lecture Theatre</span><h1 class="h1" id="w-item">{{item.n}}</h1></div></div>
          <p class="muted">{{item.q}}</p>
          <fieldset style="border: 0; padding: 0; margin: 0">
            <legend class="sr-only">{{item.n}} rating, 1 to 5</legend>
            <div class="stars" role="radiogroup" style="justify-content: space-between; max-width: 340px">
              <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
                <button type="button" class="star {{s.cls}}" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.label}}" onClick="{{s.pick}}" style="width: 56px; height: 56px"><dc-import name="Icon" i="star" s="36" f="{{s.on}}" hint-size="36px,36px"></dc-import></button>
              </sc-for>
            </div>
            <p class="t-base strong" style="margin-top: 8px" aria-live="polite">{{ratingText}}</p>
          </fieldset>
          <div class="card card-flat card-body stack-sm" style="padding: 14px">
            <span class="label">Photo evidence <span class="opt">(optional)</span></span>
            <div class="row">
              <div style="width: 72px; height: 72px; border-radius: 8px; background: #e2e8f0; display: grid; place-items: center; color: #475569" aria-label="Photo 1 attached"><dc-import name="Icon" i="camera" s="22" hint-size="22px,22px"></dc-import></div>
              <button type="button" class="btn btn-secondary btn-lg"><dc-import name="Icon" i="camera" s="18" hint-size="18px,18px"></dc-import>Take or add photo</button>
            </div>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{isResult}}" hint-placeholder-val="{{ false }}">
        <section class="stack" aria-labelledby="w-res">
          <h1 class="h1" id="w-res">Comments and result</h1>
          <div class="card card-flat card-body stack-sm" style="padding: 14px">
            <span class="t-sm strong">Your ratings</span>
            <sc-for list="{{summary}}" as="r" hint-placeholder-count="5"><div class="row-between t-sm"><span>{{r.n}}</span><span class="row" style="gap: 6px"><span class="stars-sm" aria-hidden="true"><dc-import name="Icon" i="star" s="14" f="{{ true }}" hint-size="14px,14px"></dc-import></span><span class="strong num">{{r.v}} / 5</span></span></div></sc-for>
          </div>
          <div class="field"><label class="label" for="w-cm">Comments <span class="opt">(optional)</span></label><textarea id="w-cm" class="textarea" maxlength="2000">Two ceiling fans on the east side are not working. Seating is adequate for 350; 12 broken chairs were removed.</textarea><span class="counter">112 / 2,000</span></div>
          <fieldset style="border: 0; padding: 0; margin: 0" class="field"><legend class="label" style="margin-bottom: 6px">Final result <span class="req" aria-hidden="true">*</span></legend>
            <div class="stack-sm">
              <sc-for list="{{results}}" as="r" hint-placeholder-count="3"><label class="radio-card {{r.cls}}" style="min-height: 56px"><input type="radio" name="w-r" checked="{{r.on}}" onChange="{{r.pick}}"><span class="badge" data-s="aud-{{r.v}}">{{r.v}}</span><span class="t-xs muted">{{r.d}}</span></label></sc-for>
            </div>
          </fieldset>
        </section>
      </sc-if>

      <div class="action-bar">
        <button type="button" class="btn btn-secondary btn-lg" onClick="{{back}}" disabled="{{atStart}}"><dc-import name="Icon" i="arrow-left" s="18" hint-size="18px,18px"></dc-import>Back</button>
        <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-primary btn-lg" onClick="{{next}}">Next<dc-import name="Icon" i="arrow-right" s="18" hint-size="18px,18px"></dc-import></button></sc-if>
        <sc-if value="{{isResult}}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary btn-lg" href="AuditFinalise.dc.html">Save audit</a></sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":1,"min":0,"max":6},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: null, hall: 0, r: [3, 4, 4, 2, 4], res: 'Needs Attention' }; }
  renderVals() {
    var self = this, step = this.state.step === null ? (this.props.step ?? 1) : this.state.step;
    var items = [['Ventilation', 'wind', 'Are fans, windows and air flow adequate for a full hall?'], ['Lighting', 'sun', 'Can every seat read an exam script comfortably?'], ['Seating', 'seat', 'Are chairs and desks enough, intact and spaced for invigilation?'], ['Audio system', 'volume', 'Can announcements be heard clearly at the back of the hall?'], ['Cleanliness', 'sparkles', 'Are floors, desks and toilets clean and free of litter?']];
    var words = ['Very poor', 'Poor', 'Fair', 'Good', 'Excellent'];
    var names = ['Hall'].concat(items.map(function (i) { return i[0]; })).concat(['Comments and result']);
    var idx = step - 1, r = this.state.r, cur = idx >= 0 && idx < 5 ? r[idx] : 0;
    var H = [['Faculty of Science Lecture Theatre', 'Faculty of Science Complex', 350, true], ['Education Block LR 3', 'Education Block', 120, true], ['1000-Seater Auditorium', 'Main Campus', '1,000', false], ['Arts Theatre', 'Faculty of Arts', 400, false]];
    var RS = [['Suitable', 'Ready for examinations'], ['Needs Attention', 'Usable after listed fixes'], ['Not Suitable', 'Do not use for examinations']];
    return {
      stepNo: step + 1, stepName: names[step], pct: Math.round((step + 1) / 7 * 100) + '%',
      isHall: step === 0, isRating: step >= 1 && step <= 5, isResult: step === 6, notLast: step < 6, atStart: step === 0,
      item: idx >= 0 && idx < 5 ? { n: items[idx][0], i: items[idx][1], q: items[idx][2] } : { n: '', i: 'star', q: '' },
      stars: [1, 2, 3, 4, 5].map(function (n) { var on = n <= cur; return { on: on, cls: on ? 'on' : '', checked: n === cur ? 'true' : 'false', label: n + ' — ' + words[n - 1], pick: function () { var a = self.state.r.slice(); a[idx] = n; self.setState({ r: a }); } }; }),
      ratingText: cur ? cur + ' of 5 — ' + words[cur - 1] : 'Tap a star to rate',
      halls: H.map(function (h, i) { return { n: h[0], b: h[1], c: h[2], due: h[3], on: i === self.state.hall, cls: i === self.state.hall ? 'is-on' : '', pick: function () { self.setState({ hall: i }); } }; }),
      summary: items.map(function (it, i) { return { n: it[0], v: r[i] }; }),
      results: RS.map(function (x) { var on = x[0] === self.state.res; return { v: x[0], d: x[1], on: on, cls: on ? 'is-on' : '', pick: function () { self.setState({ res: x[0] }); } }; }),
      next: function () { self.setState({ step: Math.min(step + 1, 6) }); }, back: function () { self.setState({ step: Math.max(step - 1, 0) }); }
    };
  }
}
</script>
</body>
</html>
