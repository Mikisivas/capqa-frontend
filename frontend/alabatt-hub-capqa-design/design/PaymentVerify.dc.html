<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verifying payment · ALABATT-HUB CAPQA</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./capqa.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="capqa" style="min-height: 100vh; background: #f1f5f9; display: flex; flex-direction: column">
  <div class="banner-test" role="note"><dc-import name="Icon" i="zap" s="16" hint-size="16px,16px"></dc-import>TEST MODE</div>
  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 32px 16px">
    <section class="card" style="width: 100%; max-width: 440px" aria-live="polite" aria-busy="{{busy}}">
      <div class="card-body stack" style="padding: 32px; align-items: center; text-align: center">
        <sc-if value="{{working}}" hint-placeholder-val="{{ true }}"><span class="spin" style="width: 44px; height: 44px; border-width: 4px; color: #166534" aria-hidden="true"></span></sc-if>
        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><span style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: #ecfdf3; color: #15703c"><dc-import name="Icon" i="check" s="28" hint-size="28px,28px"></dc-import></span></sc-if>
        <h1 class="h2">{{title}}</h1>
        <p class="muted">Don’t close this page. Reference <span class="mono">TXN-T-7F21C9</span></p>
        <ol style="list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; text-align: left; width: 100%">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="3"><li class="row" style="gap: 10px; flex-wrap: nowrap; color: {{s.c}}"><dc-import name="Icon" i="{{s.i}}" s="18" hint-size="18px,18px"></dc-import><span class="{{s.w}}">{{s.t}}</span><span class="sr-only">{{s.sr}}</span></li></sc-for>
        </ol>
        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary btn-lg btn-block" href="PaymentResult.dc.html">Continue</a></sc-if>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 1 }; }
  componentDidMount() { var self = this; this.t = setInterval(function () { if (self.state.n < 3) self.setState({ n: self.state.n + 1 }); else clearInterval(self.t); }, 1500); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    var n = this.state.n, done = n >= 3;
    var S = ['Gateway response received', 'Verifying payment with the gateway', 'Updating invoice and payment history'];
    return {
      working: !done, done: done, busy: done ? 'false' : 'true', title: done ? 'Payment verified' : 'Verifying your payment…',
      steps: S.map(function (t, i) { var st = i < n - (done ? -1 : 0) ? 'done' : i === n ? 'now' : 'todo'; if (i < n) st = 'done'; else if (i === n && !done) st = 'now'; else st = 'todo'; if (done) st = 'done';
        return { t: t, i: st === 'done' ? 'check-circle' : st === 'now' ? 'loader' : 'clock', c: st === 'done' ? '#15703c' : st === 'now' ? '#0f172a' : '#64748b', w: st === 'now' ? 'strong' : '', sr: st === 'done' ? ' — done' : st === 'now' ? ' — in progress' : ' — waiting' }; })
    };
  }
}
</script>
</body>
</html>
